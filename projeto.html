<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Case — Marcos Carvalho</title>
<style>
@font-face{font-family:"Pacaembu";src:url("fonts/Pacaembu-Regular.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"Pacaembu";src:url("fonts/Pacaembu-Medium.otf") format("opentype");font-weight:500;font-display:swap}
@font-face{font-family:"Pacaembu";src:url("fonts/Pacaembu-Bold.otf") format("opentype");font-weight:700;font-display:swap}
@font-face{font-family:"Pacaembu";src:url("fonts/Pacaembu-Black.otf") format("opentype");font-weight:900;font-display:swap}

:root{ --bg:#f5f4f0; --fg:#050505; --muted:#6a6a66; --line:rgba(5,5,5,.14); --maxw:1280px; }
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"Pacaembu",system-ui,sans-serif;background:var(--bg);color:var(--fg);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.5}
a{color:inherit}
img{max-width:100%;display:block}
::selection{background:var(--fg);color:var(--bg)}

/* grain */
#grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(20px,5vw,64px)}

/* nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;
  padding:22px clamp(20px,5vw,64px);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;
  mix-blend-mode:difference;color:#f5f4f0}
.nav a{text-decoration:none}
.nav .back{display:inline-flex;align-items:center;gap:8px}
.nav .back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* hero */
.hero{padding:26vh 0 8vh}
.hero .eyebrow{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  font-weight:500;margin-bottom:26px}
.hero h1{font-weight:700;font-size:clamp(52px,11vw,168px);line-height:.94;letter-spacing:-.03em}
.hero .lead{font-weight:400;font-size:clamp(20px,2.6vw,34px);line-height:1.28;max-width:34ch;margin-top:34px}
.hero .casemeta{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px 26px;align-items:baseline;
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero .casemeta .behance{color:var(--fg);border-bottom:1px solid var(--line);transition:border-color .25s}
.hero .casemeta .behance:hover{border-color:var(--fg)}

/* hero figure */
.herofig{margin:2vh 0 0}
.herofig img{width:100%;height:min(72vh,760px);object-fit:cover}

/* generic block flow */
.blocks{max-width:960px;margin:0 auto;padding:3vh 0 8vh}
.blocks.wide{max-width:var(--maxw)}
.b-text{font-weight:400;font-size:clamp(18px,1.7vw,23px);line-height:1.55;margin:0 auto 1.4em;max-width:64ch}
.b-text:last-child{margin-bottom:0}
/* images in a case stack as a tight visual sequence, not spaced-out cards;
   text/embeds get a little more air around them (see below) */
.b-fig{margin:10px 0}
.b-fig img{width:100%;display:block}
/* breathing room only where an image meets text or an embed, not image↔image */
.b-text + .b-fig{margin-top:5vh}
.b-fig + .b-text{margin-top:5vh}
.b-embed,.b-video-native{margin-top:5vh;margin-bottom:5vh}
.b-fig figcaption{font-size:13px;letter-spacing:.02em;color:var(--muted);margin-top:12px;text-align:center}
.b-video .vwrap,.b-embed .vwrap{position:relative;width:100%;padding-top:56.25%;background:#000}
.b-video .vwrap iframe,.b-embed .vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.b-video-native video{width:100%;max-height:80vh;background:#000;display:block}
.b-embed iframe.spotify{width:100%;max-width:720px;height:352px;border:0;margin:0 auto;display:block;border-radius:12px}
.b-link{display:inline-flex;align-items:center;gap:10px;margin:6px 14px 6px 0;padding:14px 24px;
  border:1px solid var(--fg);border-radius:100px;font-size:14px;letter-spacing:.04em;text-transform:uppercase;
  text-decoration:none;transition:background .25s,color .25s}
.b-link:hover{background:var(--fg);color:var(--bg)}
.linkrow{max-width:64ch;margin:2.4em auto 0;display:flex;flex-wrap:wrap}

/* chapters (subprojects) */
.chapters{border-top:1px solid var(--line);margin-top:4vh}
.chapter{border-bottom:1px solid var(--line);padding:11vh 0}
.chapter .chhead{display:grid;grid-template-columns:minmax(120px,1fr) 3fr;gap:clamp(20px,5vw,80px);align-items:start}
.chapter .chnum{font-weight:200;font-size:clamp(60px,9vw,150px);line-height:.8;color:var(--fg);opacity:.16}
.chapter h2{font-weight:700;font-size:clamp(30px,5vw,68px);line-height:1.02;letter-spacing:-.02em;align-self:end}
.chapter .chblocks{margin-top:5vh}

/* all projects list */
.morework{padding:10vh 0 4vh;border-top:1px solid var(--line)}
.mw-label{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}
.mw-row{display:flex;justify-content:space-between;align-items:baseline;gap:24px;
  padding:22px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;
  transition:padding-left .3s cubic-bezier(.22,.61,.36,1)}
.mw-row:hover{padding-left:20px}
.mw-t{font-weight:500;font-size:clamp(20px,3vw,40px);letter-spacing:-.01em}
.mw-m{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;white-space:nowrap}
@media (max-width:600px){.mw-row{flex-direction:column;gap:6px}.mw-m{text-align:left}}

/* footer */
.foot{border-top:1px solid var(--line);padding:9vh 0 12vh;text-align:center}
.foot .home{display:inline-flex;align-items:center;gap:12px;font-weight:700;
  font-size:clamp(28px,5vw,64px);letter-spacing:-.02em;text-decoration:none}
.foot .home .arrow{transition:transform .3s}
.foot .home:hover .arrow{transform:translateX(6px)}
.foot .meta{margin-top:40px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* not found */
.notfound{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
.notfound h1{font-weight:700;font-size:clamp(28px,5vw,48px)}
.notfound a{color:var(--muted)}

/* reveal */
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s cubic-bezier(.16,.84,.36,1),transform .9s cubic-bezier(.16,.84,.36,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{transition:none}html{scroll-behavior:auto}}

/* page transition wipe — matches the cinematic nav on index/solvefy (CSS only) */
#page-transition{position:fixed;inset:0;z-index:300;background:var(--fg);pointer-events:none;
  clip-path:inset(100% 0 0 0);transition:clip-path .6s cubic-bezier(.76,0,.24,1)}
#page-transition.cover{clip-path:inset(0 0 0 0)}
#page-transition.reveal{clip-path:inset(0 0 100% 0)}
@media (prefers-reduced-motion:reduce){#page-transition{display:none}}

@media (max-width:720px){
  .chapter .chhead{grid-template-columns:1fr;gap:10px}
  .chapter h2{align-self:auto}
}
</style>
</head>
<body>
<div id="grain"></div>
<div id="page-transition"></div>

<nav class="nav">
  <a href="index.html" data-back>Marcos Carvalho</a>
  <a href="index.html#work" class="back" data-back><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg> Work</a>
</nav>

<main id="app"></main>

<script>
'use strict';

/* ---------- read project from the CMS (shared localStorage) ---------- */
const params = new URLSearchParams(location.search);
const id = params.get('id');
const app = document.getElementById('app');
let data = null, project = null;

/* Source of truth for the published site is the static data/projects.json
   (works for every visitor). The CMS localStorage, when present on the
   author's own machine, overrides project CONTENT by id for live preview,
   while the static file still defines the canonical order. */
async function loadData(){
  let stat = null, ls = null;
  try { const r = await fetch('data/projects.json', { cache: 'no-cache' }); if (r.ok) stat = await r.json(); } catch(e){}
  try { ls = JSON.parse(localStorage.getItem('projects-crm-v1')); } catch(e){}
  const order = [], map = new Map();
  (stat && Array.isArray(stat.projects) ? stat.projects : []).forEach(p => { map.set(p.id, p); order.push(p.id); });
  (ls && Array.isArray(ls.projects) ? ls.projects : []).forEach(p => { if (!map.has(p.id)) order.push(p.id); map.set(p.id, p); });
  return { projects: order.map(i => map.get(i)) };
}
const esc = s => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- read-only access to the CMS's IndexedDB video store ----------
   Videos live there instead of in the localStorage JSON (see cms.html for
   why: a real short clip is easily 10-50MB, past what a single localStorage
   entry can hold across a whole browser). */
const MEDIA_DB = 'cms-media-v1', MEDIA_STORE = 'blobs';
function openMediaDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(MEDIA_DB, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(MEDIA_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function getMediaBlob(id){
  const db = await openMediaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(MEDIA_STORE, 'readonly');
    const req = tx.objectStore(MEDIA_STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
function hydrateVideoBlocks(root){
  root.querySelectorAll('video[data-media-id]').forEach(async v => {
    try {
      const blob = await getMediaBlob(v.dataset.mediaId);
      if (blob) v.src = URL.createObjectURL(blob);
    } catch(e){ /* leave it empty rather than break the page */ }
  });
}

/* YouTube link detection (same logic as cms.html) — watch/short/embed/youtu.be */
function youtubeId(url){
  if (!url) return null;
  try {
    const u = new URL(url, location.href);
    const host = u.hostname.replace(/^www\./, '').replace(/^m\./, '');
    if (host === 'youtu.be') return u.pathname.slice(1).split('/')[0] || null;
    if (host === 'youtube.com' || host === 'music.youtube.com'){
      if (u.pathname === '/watch') return u.searchParams.get('v');
      let m = u.pathname.match(/^\/embed\/([^/?]+)/); if (m) return m[1];
      m = u.pathname.match(/^\/shorts\/([^/?]+)/); if (m) return m[1];
    }
  } catch(e){}
  return null;
}

(async function init(){
  data = await loadData();
  project = data.projects.find(p => p.id === id) || null;
  if (!project){
    app.innerHTML = `<div class="notfound">
      <h1>Case não encontrado</h1>
      <p style="color:var(--muted);max-width:46ch">Este projeto não existe, ou o link está sem id.
      <a href="index.html">← Voltar para a home</a>
    </div>`;
    document.title = 'Case não encontrado — Marcos Carvalho';
  } else {
    render(project);
  }
})();

/* ---------- render one content block into a container ---------- */
function renderBlock(b){
  if (b.type === 'text' && b.text){
    const frag = document.createDocumentFragment();
    // split paragraphs on blank lines
    b.text.split(/\n{2,}/).forEach(par => {
      if (!par.trim()) return;
      const p = document.createElement('p');
      p.className = 'b-text rv';
      p.textContent = par.trim();
      frag.appendChild(p);
    });
    return frag;
  }
  if (b.type === 'image' && b.src){
    const fig = document.createElement('figure');
    fig.className = 'b-fig rv';
    fig.innerHTML = `<img src="${b.src}" alt="${esc(b.alt || b.caption)}" loading="lazy" decoding="async">` +
      (b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : '');
    return fig;
  }
  if (b.type === 'embed' && b.src){
    // imported Behance embeds: YouTube / Vimeo / Spotify / Adobe CCV video
    const fig = document.createElement('figure');
    fig.className = 'b-fig b-embed rv';
    const cap = b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : '';
    if (b.provider === 'spotify'){
      fig.innerHTML = `<iframe class="spotify" src="${esc(b.src)}" loading="lazy"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>` + cap;
    } else {
      fig.innerHTML = `<div class="vwrap"><iframe src="${esc(b.src)}" loading="lazy"
        title="${esc(b.caption || 'Embedded media')}" referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen></iframe></div>` + cap;
    }
    return fig;
  }
  if (b.type === 'video' && (b.mediaId || b.src)){
    // uploaded short clip: plays itself, muted+loop so autoplay is allowed
    // by every browser (including mobile), no user interaction needed.
    // mediaId videos load async from IndexedDB via hydrateVideoBlocks();
    // b.src is only for legacy blocks saved before that migration.
    const fig = document.createElement('figure');
    fig.className = 'b-fig b-video-native rv';
    fig.innerHTML = `<video autoplay muted loop playsinline controls${b.mediaId ? ` data-media-id="${b.mediaId}"` : ''}${b.src ? ` src="${b.src}"` : ''}></video>` +
      (b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : '');
    return fig;
  }
  if (b.type === 'link' && b.url){
    const yid = youtubeId(b.url);
    if (yid){
      const fig = document.createElement('figure');
      fig.className = 'b-fig b-video rv';
      fig.innerHTML = `<div class="vwrap"><iframe src="https://www.youtube-nocookie.com/embed/${yid}"
        title="${esc(b.label || 'YouTube video')}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>` +
        (b.label ? `<figcaption>${esc(b.label)}</figcaption>` : '');
      return fig;
    }
    // group consecutive plain links visually via a row; here return a single
    // link, the caller wraps loose links in .linkrow
    const a = document.createElement('a');
    a.className = 'b-link';
    a.href = b.url; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = (b.label || b.url);
    return a;
  }
  return document.createDocumentFragment();
}

function renderBlocksInto(container, blocks){
  let linkRow = null;
  (blocks || []).forEach(b => {
    // YouTube links render full width like a figure, not grouped as a pill button
    const isPlainLink = b.type === 'link' && b.url && !youtubeId(b.url);
    if (isPlainLink){
      if (!linkRow){ linkRow = document.createElement('div'); linkRow.className = 'linkrow rv'; container.appendChild(linkRow); }
      linkRow.appendChild(renderBlock(b));
    } else {
      linkRow = null;
      container.appendChild(renderBlock(b));
    }
  });
}

/* ---------- render the whole case ---------- */
function render(p){
  document.title = (p.title || 'Case') + ' — Marcos Carvalho';
  // hero image = the project's first full-res image; it then leads the body,
  // so we skip that one block below to avoid showing it twice.
  const heroImg = p.firstImage || (p.hoverImages && p.hoverImages[0]) || p.hoverImage
                  || (p.blocks.find(b => b.type === 'image' && b.src) || {}).src;
  const frag = document.createDocumentFragment();

  const tools = (p.tools && p.tools.length) ? p.tools.join(' · ') : '';
  // hero
  const hero = document.createElement('header');
  hero.className = 'hero';
  hero.innerHTML = `<div class="wrap">
    ${(p.eyebrow || p.meta) ? `<div class="eyebrow rv">${esc(p.eyebrow || p.meta)}</div>` : ''}
    <h1 class="rv">${esc(p.title || 'Untitled')}</h1>
    ${p.summary ? `<p class="lead rv">${esc(p.summary)}</p>` : ''}
    ${(tools || p.behanceUrl) ? `<div class="casemeta rv">
      ${tools ? `<span class="tools">${esc(tools)}</span>` : ''}
      ${p.behanceUrl ? `<a class="behance" href="${esc(p.behanceUrl)}" target="_blank" rel="noopener">View on Behance ↗</a>` : ''}
    </div>` : ''}
  </div>`;
  frag.appendChild(hero);

  // hero figure
  if (heroImg){
    const hf = document.createElement('figure');
    hf.className = 'herofig rv';
    hf.innerHTML = `<img src="${heroImg}" alt="${esc(p.title || '')}" decoding="async">`;
    frag.appendChild(hf);
  }

  // overview blocks (project-level content) — drop the one image already used as hero
  if (p.blocks && p.blocks.length){
    const ov = document.createElement('section');
    ov.className = 'blocks wrap';
    let skipped = false;
    const body = p.blocks.filter(b => {
      if (!skipped && b.type === 'image' && b.src === heroImg){ skipped = true; return false; }
      return true;
    });
    renderBlocksInto(ov, body);
    frag.appendChild(ov);
  }

  // chapters (subprojects)
  const subs = (p.subprojects || []).filter(s => s);
  if (subs.length){
    const chs = document.createElement('div');
    chs.className = 'chapters';
    subs.forEach((s, i) => {
      const sec = document.createElement('section');
      sec.className = 'chapter';
      const inner = document.createElement('div');
      inner.className = 'wrap';
      inner.innerHTML = `<div class="chhead">
        <div class="chnum rv">${String(i + 1).padStart(2, '0')}</div>
        <h2 class="rv">${esc(s.title || 'Untitled')}</h2>
      </div>`;
      const blk = document.createElement('div');
      blk.className = 'chblocks';
      renderBlocksInto(blk, s.blocks);
      inner.appendChild(blk);
      sec.appendChild(inner);
      chs.appendChild(sec);
    });
    frag.appendChild(chs);
  }

  // all other projects (index at the end of the case)
  const others = (data.projects || []).filter(x => x.visible !== false && x.id !== p.id);
  if (others.length){
    const mw = document.createElement('section');
    mw.className = 'morework wrap';
    mw.innerHTML = `<div class="mw-label rv">All projects</div>`;
    const list = document.createElement('div');
    list.className = 'mw-list';
    others.forEach(o => {
      const a = document.createElement('a');
      a.className = 'mw-row rv';
      a.href = 'projeto.html?id=' + encodeURIComponent(o.id);
      a.innerHTML = `<span class="mw-t">${esc(o.title || 'Untitled')}</span><span class="mw-m">${esc(o.meta || '')}</span>`;
      list.appendChild(a);
    });
    mw.appendChild(list);
    frag.appendChild(mw);
  }

  // footer
  const foot = document.createElement('footer');
  foot.className = 'foot';
  foot.innerHTML = `<div class="wrap">
    <a class="home" href="index.html#work" data-back>Back to work <span class="arrow">→</span></a>
    <div class="meta">Marcos Carvalho — Experience specialist · AI native Designer</div>
  </div>`;
  frag.appendChild(foot);

  app.appendChild(frag);
  hydrateVideoBlocks(app);
  setupReveals();
}

/* ---------- scroll reveals ---------- */
function setupReveals(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const items = document.querySelectorAll('.rv');
  if (reduce || !('IntersectionObserver' in window)){ items.forEach(el => el.classList.add('in')); return; }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { rootMargin: '0px 0px -12% 0px' });
  items.forEach(el => io.observe(el));
}
</script>

<script>
/* cinematic page-transition wipe, shared behaviour with index/solvefy but
   CSS-driven here (this page doesn't load GSAP). Reveals on arrival when we
   came from a wiped link, and wipes out before same-origin navigations. */
(function(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ov = document.getElementById('page-transition');
  if (!ov || reduce) return;
  if (sessionStorage.getItem('pt-arrive')){
    sessionStorage.removeItem('pt-arrive');
    ov.style.transition = 'none';           // snap to fully covered, no anim
    ov.classList.add('cover');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      ov.style.transition = '';             // then wipe away
      ov.classList.remove('cover'); ov.classList.add('reveal');
    }));
  }
  document.addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return;
    const href = a.getAttribute('href') || '';
    if (a.target === '_blank' || !href || href.startsWith('http') || href.startsWith('#') || href.startsWith('mailto')) return;
    e.preventDefault();
    sessionStorage.setItem('pt-arrive', '1');
    ov.classList.remove('reveal'); ov.classList.add('cover');
    setTimeout(() => { location.href = href; }, 560);
  });
})();
</script>
</body>
</html>
